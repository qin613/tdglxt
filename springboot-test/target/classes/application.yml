server:
  port: 8080

spring:
  application:
    name: springboot-test
  
  # 热部署配置
  devtools:
    restart:
      enabled: true  # 启用热部署
      additional-paths: src/main/java  # 监控的目录
      exclude: static/**,public/**  # 排除的目录
    livereload:
      enabled: true  # 启用浏览器自动刷新
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/dessert_shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: qin20050613
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis:
  type-aliases-package: com.example.springboot.entity
  configuration:
    map-underscore-to-camel-case: true

# 文件上传配置
file:
  upload:
    path: ./uploads

# 日志配置
logging:
  level:
    root: INFO
    com.example.springboot: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  charset:
    console: UTF-8
